services:
  - type: web
    name: teacheros-api
    runtime: node
    rootDir: .
    # Render's free tier sleeps after idle periods. Upgrade this service to a
    # paid instance when the API must remain available without a wake-up delay.
    plan: free
    region: ohio
    # Free-tier services cannot use Render's pre-deploy hook. Run idempotent
    # migrations while building so a cold start only needs to launch the API.
    buildCommand: npm ci --include=dev && npm run build && npm --workspace @teacheros/db run db:migrate
    startCommand: npm --workspace @teacheros/api run start
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: API_PORT
        value: 3001
      - key: REQUEST_ID_HEADER
        value: x-request-id
      - key: DATABASE_URL
        fromDatabase:
          name: teacheros-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teacheros-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://teacher-dashboard-clean.pages.dev,https://teacheros-aidan-web.onrender.com,https://teacheros-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_PARSE_SCHEDULE
        value: gpt-5.6-luna
      - key: OPENAI_MODEL_GENERATE_SEGMENTS
        value: gpt-5.6-luna
      - key: OPENAI_MODEL_CONTINUITY
        value: gpt-5.6-luna
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: teacheros-web
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm --workspace @teacheros/web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
