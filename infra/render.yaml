services:
  - type: web
    name: teacheros-api
    runtime: node
    rootDir: .
    # Keep the initial API deployment on Render's free web-service tier. Upgrade
    # deliberately later if usage requires an always-on instance.
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    # Free-tier web services do not support Render's separate pre-deploy hook.
    # Run the idempotent migration immediately before starting the API instead.
    startCommand: npm --workspace @teacheros/db run db:migrate && npm --workspace @teacheros/api run start
    healthCheckPath: /health/readiness
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: API_PORT
        value: 3001
      - key: REQUEST_ID_HEADER
        value: x-request-id
      - key: DATABASE_URL
        fromDatabase:
          name: teacheros-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teacheros-redis
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://teacheros-aidan-web.onrender.com,https://teacheros-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_PARSE_SCHEDULE
        value: gpt-5.6-luna
      - key: OPENAI_MODEL_GENERATE_SEGMENTS
        value: gpt-5.6-luna
      - key: OPENAI_MODEL_CONTINUITY
        value: gpt-5.6-luna
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: teacheros-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm --workspace @teacheros/web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
